apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: demo-nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: nginx
    newName: nginx
    newTag: 1.27-alpine
